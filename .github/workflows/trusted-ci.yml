name: ORVEN trusted CI

on:
  workflow_call:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ORVEN_NODE_VERSION: "24.18.1"
  ORVEN_NPM_VERSION: "11.16.0"
  TEST_ONLY_NON_PROMOTABLE: "true"

jobs:
  verify:
    name: trusted verification
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact caller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - name: Execute repository trust entrypoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${ORVEN_NODE_VERSION}"
          test "$(npm --version)" = "${ORVEN_NPM_VERSION}"
          node .ci/trusted.mjs
          git diff --exit-code -- . ':(exclude).ci-out'
      - name: Upload non-promotable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orven-ci-${{ github.event.repository.name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  aggregate:
    name: trusted aggregate
    if: ${{ always() }}
    needs: [verify]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every dependency to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "${VERIFY_RESULT}" = "success"
